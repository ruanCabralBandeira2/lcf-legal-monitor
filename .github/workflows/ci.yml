name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://legal_monitor:legal_monitor_ci@127.0.0.1:5432/legal_monitor
      TEST_DATABASE_URL: postgresql://legal_monitor:legal_monitor_ci@127.0.0.1:5432/legal_monitor
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: legal_monitor
          POSTGRES_USER: legal_monitor
          POSTGRES_PASSWORD: legal_monitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_monitor -d legal_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.lock

      - name: Verificar código
        run: |
          ruff format --check .
          ruff check .

      - name: Aplicar migrações no PostgreSQL de teste
        run: PYTHONPATH=src python scripts/migrate.py

      - name: Executar testes
        run: python -m pytest

      - name: Verificar dependências
        run: python -m pip check
