services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_monitor
      POSTGRES_USER: legal_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_monitor_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - legal_monitor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_monitor -d legal_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  legal_monitor_postgres:
